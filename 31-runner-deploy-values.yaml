# helm install runner-deploy gitlab/gitlab-runner -n ci-deploy -f 31-runner-deploy-values.yaml --version <chart 17.6.x>
#   kubectl -n ci-deploy create secret generic runner-token \
#     --from-literal=runner-token='glrt-YYYY' --from-literal=runner-registration-token=''
image:
  registry: harbor.example.com
  image: ci/gitlab-runner
  tag: alpine-v17.6.0
imagePullPolicy: IfNotPresent

gitlabUrl: http://<GITLAB_HOST>/     # CHANGE
concurrent: 2
checkInterval: 5
rbac:
  create: true
metrics:
  enabled: false

runners:
  secret: runner-token
  config: |
    [[runners]]
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "ci-deploy"
        service_account = "ci-deploy-job"
        automount_service_account_token = true
        privileged = false
        image = "harbor.example.com/ci/helm-kubectl:CAMBIAR"
        helper_image = "harbor.example.com/ci/gitlab-runner-helper:x86_64-v17.6.0"
        pull_policy = ["if-not-present"]
        cpu_request = "100m"
        cpu_limit = "500m"
        memory_request = "128Mi"
        memory_limit = "512Mi"
        poll_timeout = 600
