# Platform test pipeline. Copy it as .gitlab-ci.yml into an empty project
# inside the desarrollo-k8s group.
stages: [test]

build_test:
  stage: test
  tags: [k8s-build]
  image: harbor.example.com/base/alpine:3.20
  script:
    - echo "hello from $(hostname)"
    - id
    # The build job must NOT have access to the Kubernetes API
    - 'ls /var/run/secrets/kubernetes.io/serviceaccount 2>/dev/null && { echo "ERROR: a ServiceAccount token is present"; exit 1; } || echo "OK: no ServiceAccount token"'
    # The cluster has no internet
    - 'wget -q -T 5 -O /dev/null http://example.com && { echo "ERROR: internet is reachable"; exit 1; } || echo "OK: no internet"'
    # Harbor must be reachable (Kaniko will need it)
    - wget -q -T 5 --no-check-certificate -O - https://harbor.example.com/api/v2.0/ping

deploy_test:
  stage: test
  tags: [k8s-deploy]
  image: harbor.example.com/ci/helm-kubectl:1.36.0
  script:
    - kubectl version --client
    - helm version --short
    - NS="app-citest-$CI_PIPELINE_ID"
    - |
      cat <<EOF | kubectl create -f -
      apiVersion: v1
      kind: Namespace
      metadata:
        name: $NS
        labels:
          pod-security.kubernetes.io/enforce: baseline
      EOF
    - kubectl -n "$NS" create rolebinding ci-deploy --clusterrole=ci-deploy-app --serviceaccount=ci-deploy:ci-deploy-job
    - sleep 3
    - kubectl -n "$NS" create configmap prueba --from-literal=a=b
    - kubectl -n "$NS" get configmap prueba
    # This MUST fail; the '!' makes the job pass if it fails
    - "! kubectl -n kube-system get secrets"
    - kubectl delete ns "$NS"
  after_script:
    - kubectl delete ns "app-citest-$CI_PIPELINE_ID" --ignore-not-found --wait=false || true
