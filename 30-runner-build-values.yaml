# helm install runner-build gitlab/gitlab-runner -n ci-build -f 30-runner-build-values.yaml --version <chart 17.6.x>
# Antes: secret con el token del runner de grupo (tag k8s-build):
#   kubectl -n ci-build create secret generic runner-token \
#     --from-literal=runner-token='glrt-XXXX' --from-literal=runner-registration-token=''
image:
  registry: harbor.stic.intranet.net
  image: ci/gitlab-runner
  tag: alpine-v17.6.0          # comprobar que el tag existe en tu Harbor
imagePullPolicy: IfNotPresent

gitlabUrl: http://<GITLAB_HOST>/     # CAMBIAR
concurrent: 4
checkInterval: 5
rbac:
  create: true
metrics:
  enabled: false

runners:
  secret: runner-token
  config: |
    [[runners]]
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "ci-build"
        service_account = "ci-build-job"
        automount_service_account_token = false
        privileged = false
        image = "harbor.stic.intranet.net/base/alpine:3.20"
        helper_image = "harbor.stic.intranet.net/ci/gitlab-runner-helper:x86_64-v17.6.0"
        pull_policy = ["if-not-present"]
        cpu_request = "250m"
        cpu_limit = "2"
        memory_request = "512Mi"
        memory_limit = "3Gi"
        poll_timeout = 600
