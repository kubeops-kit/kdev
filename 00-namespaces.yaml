# Namespaces where the runners and their job pods live.
# Pod Security: baseline enforced (Kaniko runs as root but without privileges).
apiVersion: v1
kind: Namespace
metadata:
  name: ci-build
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    kubeops/role: ci
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-deploy
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    kubeops/role: ci
---
# SA of the BUILD pods: no access to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build-job
  namespace: ci-build
automountServiceAccountToken: false
---
# SA of the DEPLOY pods: its permissions are defined in 10-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy-job
  namespace: ci-deploy
