# Namespaces donde viven los runners y sus pods de job.
# Pod Security: baseline obligatorio (Kaniko corre como root pero sin privilegios).
apiVersion: v1
kind: Namespace
metadata:
  name: ci-build
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    kubeops/role: ci
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-deploy
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    kubeops/role: ci
---
# SA de los pods de BUILD: sin acceso a la API de Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build-job
  namespace: ci-build
automountServiceAccountToken: false
---
# SA de los pods de DEPLOY: sus permisos se definen en 10-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy-job
  namespace: ci-deploy
---
# Runner de despliegue a PRODUCCIÓN: separado del de ramas y marcado como «protegido» en GitLab,
# de modo que solo ejecuta trabajos de ramas y etiquetas protegidas (main).
apiVersion: v1
kind: Namespace
metadata:
  name: ci-deploy-prod
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    kubeops/role: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy-prod-job
  namespace: ci-deploy-prod
