# Design: the deploy SA has NO cluster-wide secret read access.
# - At cluster level it can only: manage namespaces, and CREATE (not modify/delete)
#   quotas, limitranges and rolebindings.
# - Inside each app-* namespace it gets the ci-deploy-app role through a RoleBinding
#   created by the pipeline itself.
# - The admission policy (20-admission-policy.yaml) limits ALL its writes to app-*.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deploy-bootstrap
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  # Allows creating RoleBindings that point ONLY to ci-deploy-app
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [ci-deploy-app, kdev-reader]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-deploy-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-deploy-bootstrap
subjects:
  - kind: ServiceAccount
    name: ci-deploy-job
    namespace: ci-deploy
---
# Permissions INSIDE an app-* namespace (used with a RoleBinding, never a ClusterRoleBinding).
# No quotas, limitranges or rolebindings: it cannot remove its own limits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deploy-app
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Permissions of the PRODUCTION SA: the minimum to create and update. It cannot delete namespaces
# (deleting a production environment is done by hand, with an administrator).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deploy-prod-bootstrap
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [ci-deploy-app, kdev-reader]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-deploy-prod-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-deploy-prod-bootstrap
subjects:
  - kind: ServiceAccount
    name: ci-deploy-prod-job
    namespace: ci-deploy-prod
