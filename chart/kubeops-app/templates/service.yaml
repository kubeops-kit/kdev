apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}-front
  labels:
    {{- include "kubeops-app.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.app }}
    app.kubernetes.io/component: front
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}-back
  labels:
    {{- include "kubeops-app.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.app }}
    app.kubernetes.io/component: back
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
