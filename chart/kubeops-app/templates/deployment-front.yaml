apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}-front
  labels:
    {{- include "kubeops-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app }}
      app.kubernetes.io/component: front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app }}
        app.kubernetes.io/component: front
    spec:
      automountServiceAccountToken: false
      containers:
        - name: front
          image: "{{ .Values.image.registry }}/{{ .Values.app }}-front:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
