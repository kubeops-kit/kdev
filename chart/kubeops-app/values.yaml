# Default values of kubeops-app.
# Developers' projects override only what they need in deploy/values.yaml.
# Those marked "pipeline" are injected by ci-template.yml with --set.

app: ""               # pipeline: app name (APP_NAME)
replicaCount: 1       # pipeline: raised with --set in production

image:
  registry: harbor.example.com/apps   # pipeline
  tag: ""                                    # pipeline: commit SHA

ingress:
  host: ""            # pipeline
  className: ""       # empty = default class (Traefik)

frontend:
  port: 80
  healthPath: /
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

backend:
  port: 3000
  healthPath: /api/health
  apiPath: /api       # Ingress path that goes to the backend (not stripped)
  secretName: app-db  # Secret the pipeline creates with DB_USER / DB_PASSWORD
  env: {}             # NON-sensitive variables: { DB_HOST: bd-dev, DB_PORT: "5432" }
  secretEnv: []       # key names of that Secret: [DB_USER, DB_PASSWORD]
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
