# Security barriers for the deployment runners. Each one can only WRITE in its own type of environment:
#   - branch runner          (ci-deploy:ci-deploy-job)            -> namespaces app-<app>-review-<slug>
#   - production runner      (ci-deploy-prod:ci-deploy-prod-job)  -> namespaces app-<app>-prod
# A namespace is identified by its NAME and its kubeops/env LABEL, and both must match.
# The branch runner can never touch production, even if someone writes their own job with that runner.
# INITIAL STATE: warning mode (Warn). It blocks nothing; the client sees "Warning: Validation failed for
# ValidatingAdmissionPolicy ..." when the policy would have blocked. It is activated with proteccion.sh enforce.
# Scope: each policy only evaluates requests from its ServiceAccount, so it does not affect the rest of the cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ci-deploy-ramas
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  matchConditions:
    - name: solo-runner-de-ramas
      expression: "request.userInfo.username == 'system:serviceaccount:ci-deploy:ci-deploy-job'"
  validations:
    - expression: >-
        request.resource.resource == 'namespaces'
        ? request.name.matches('^app-[a-z0-9-]+-review-[a-z0-9-]+-[a-z0-9]{6}$')
        : (request.namespace.matches('^app-[a-z0-9-]+-review-[a-z0-9-]+-[a-z0-9]{6}$') &&
           has(namespaceObject.metadata.labels) &&
           'kubeops/env' in namespaceObject.metadata.labels &&
           namespaceObject.metadata.labels['kubeops/env'] == 'review')
      message: "The branch runner can only write to branch environments (app-<app>-review-<environment>)"
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation == 'DELETE' ||
        (has(object.metadata.labels) &&
         'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'] &&
         'kubeops/env' in object.metadata.labels &&
         object.metadata.labels['kubeops/env'] == 'review')
      message: "Branch namespaces must carry kubeops/env=review and pod-security.kubernetes.io/enforce=baseline|restricted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ci-deploy-ramas
spec:
  policyName: ci-deploy-ramas
  validationActions: [Warn, Audit]   # WARNING MODE. "proteccion.sh enforce" changes it to [Deny] when the battery comes out clean
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ci-deploy-produccion
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  matchConditions:
    - name: solo-runner-de-produccion
      expression: "request.userInfo.username == 'system:serviceaccount:ci-deploy-prod:ci-deploy-prod-job'"
  validations:
    - expression: >-
        request.resource.resource == 'namespaces'
        ? request.name.matches('^app-[a-z0-9-]+-prod$')
        : (request.namespace.matches('^app-[a-z0-9-]+-prod$') &&
           has(namespaceObject.metadata.labels) &&
           'kubeops/env' in namespaceObject.metadata.labels &&
           namespaceObject.metadata.labels['kubeops/env'] == 'prod')
      message: "The production runner can only write to production environments (app-<app>-prod)"
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation == 'DELETE' ||
        (has(object.metadata.labels) &&
         'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'] &&
         'kubeops/env' in object.metadata.labels &&
         object.metadata.labels['kubeops/env'] == 'prod')
      message: "Production namespaces must carry kubeops/env=prod and pod-security.kubernetes.io/enforce=baseline|restricted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ci-deploy-produccion
spec:
  policyName: ci-deploy-produccion
  validationActions: [Warn, Audit]   # WARNING MODE. "proteccion.sh enforce" changes it to [Deny] when the battery comes out clean
